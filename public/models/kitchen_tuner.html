<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a12; overflow: hidden; }
canvas { display: block; }
#hud { position: fixed; top: 14px; left: 14px; background: rgba(0,0,0,0.75); color: #00ff88; font-family: monospace; font-size: 13px; padding: 10px 14px; border-radius: 8px; line-height: 1.8; pointer-events: none; border: 1px solid rgba(0,255,136,0.2); }
#hud span { color: #fff; }
#copy { position: fixed; top: 14px; right: 14px; background: #1a1a2e; color: #00ff88; font-family: monospace; font-size: 12px; padding: 8px 14px; border-radius: 6px; border: 1px solid rgba(0,255,136,0.3); cursor: pointer; }
#copy:hover { background: #252540; }
#copied { position: fixed; top: 54px; right: 14px; color: #00ff88; font-family: monospace; font-size: 11px; opacity: 0; transition: opacity 0.3s; }
#slots-panel { position: fixed; top: 90px; left: 14px; background: rgba(0,0,0,0.75); color: #ff00ff; font-family: monospace; font-size: 12px; padding: 10px 14px; border-radius: 8px; line-height: 1.6; border: 1px solid rgba(255,0,255,0.2); }
#slots-panel div { cursor: pointer; padding: 2px 4px; border-radius: 4px; }
#slots-panel div:hover { background: rgba(255,0,255,0.2); }
#info { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); color: #666; font-family: monospace; font-size: 12px; }
</style>
</head>
<body>
<div id="hud">
  pos:    [<span id="px">0</span>, <span id="py">0</span>, <span id="pz">0</span>]<br>
  target: [<span id="tx">0</span>, <span id="ty">0</span>, <span id="tz">0</span>]
</div>
<button id="copy" onclick="copyKeyframe()">Copy keyframe</button>
<div id="copied">Copied!</div>
<div id="slots-panel"></div>
<div id="info">drag to orbit · scroll to zoom · right-drag to pan</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x1e2a22);
scene.fog=new THREE.FogExp2(0x1e2a22,0.016);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
document.body.appendChild(renderer.domElement);

const C={
stoneL:0x6a7a72,stoneM:0x4a5a52,stoneD:0x3a4a42,wallBase:0x4a5a4a,wallD:0x2a3a2e,
green1:0x4a6a4a,green2:0x3a5a3a,green3:0x5a7a5a,
wood:0x4a3a2a,woodD:0x2a1e14,woodL:0x5a4a3a,
gold:0x7a6a3a,iron:0x2e3034,ironL:0x3e4044,
bread:0x8a7050,cheese:0xa89040,meat:0x6a3028,carrot:0x9a5020,cabbage:0x4a6a42,
apple:0x6a2820,pumpkin:0x9a6020,fish:0x6a7a7a,ceramic:0x8a9a8a,
warm:0x8a7a5a,candle:0xffcc66,skin:0xb89070,skinD:0x9a7050,
cloth:0x8a9a8a,clothD:0x5a6a5a,apron:0x9aaa9a,
copper:0x8a5a3a,copperL:0xaa7a4a,sausage:0x6a3a2a,wine:0x3a2a3a,
clay:0x7a6a5a,basket:0x6a5a3a,rope:0x8a7a5a,garlic:0xcacaaa,red:0x7a3a3a
};

function mt(c){return new THREE.MeshStandardMaterial({color:c,flatShading:true,roughness:.85,metalness:.05})}
function mm(c){return new THREE.MeshStandardMaterial({color:c,flatShading:true,roughness:.4,metalness:.6})}
function mc(c){return new THREE.MeshStandardMaterial({color:c,flatShading:true,roughness:.3,metalness:.5})}
function J(g,a=.05){const p=g.attributes.position;for(let i=0;i<p.count;i++){p.setX(i,p.getX(i)+(Math.random()-.5)*a);p.setY(i,p.getY(i)+(Math.random()-.5)*a);p.setZ(i,p.getZ(i)+(Math.random()-.5)*a);}p.needsUpdate=true;g.computeVertexNormals();return g;}
function add(geo,mat,x,y,z,rx,ry,rz,sx,sy,sz,parent){
const m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);
if(rx)m.rotation.x=rx;if(ry)m.rotation.y=ry;if(rz)m.rotation.z=rz;
if(sx||sy||sz)m.scale.set(sx||1,sy||1,sz||1);
m.castShadow=true;m.receiveShadow=true;(parent||scene).add(m);return m;}

const RW=16,RH=9,RD=14,fl=[];

// Floor
add(J(new THREE.BoxGeometry(RW,.4,RD,6,1,5),0.05),mt(C.stoneD),0,-.2,0);
for(let ix=-3;ix<=3;ix++)for(let iz=-3;iz<=3;iz++)
add(J(new THREE.BoxGeometry(1.8+Math.random()*.3,.05,1.8+Math.random()*.3,2,1,2),.02),mt((ix+iz)%2===0?C.stoneM:C.stoneD),ix*2.1,.03,iz*2.1);

// Walls
function wb(w,h,d,x,y,z,c){add(J(new THREE.BoxGeometry(w,h,d,Math.max(1,Math.ceil(w/2)),Math.max(1,Math.ceil(h/2)),Math.max(1,Math.ceil(d/2))),.05),mt(c||C.wallBase),x,y,z)}
wb(RW,RH,.6,0,RH/2,-RD/2);wb(.6,RH,RD,-RW/2,RH/2,0);wb(.6,RH,RD,RW/2,RH/2,0);
add(new THREE.BoxGeometry(RW,.3,RD),mt(C.wallD),0,RH+.15,0);

// Beams
for(let z=-5;z<=5;z+=2.5)add(J(new THREE.BoxGeometry(RW-1,.45,.4,5,1,1),.04),mt(C.woodD),0,RH-.2,z);
for(let x=-5;x<=5;x+=5)add(J(new THREE.BoxGeometry(.35,.4,RD-1,1,1,5),.04),mt(C.woodD),x,RH-.4,0);

// Bricks
const bCols=[0x4a5a4a,0x5a6a5a,0x3a4a3a,0x6a7a6a,0x4a5a48,0x3a4a3e];
for(let w=0;w<3;w++)for(let i=0;i<25;i++){
let bx,by,bz,ry=0;by=.4+Math.random()*(RH-1);
if(w===0){bx=(Math.random()-.5)*(RW-2);bz=-RD/2+.4;}
else if(w===1){bz=(Math.random()-.5)*(RD-2);bx=-RW/2+.4;ry=Math.PI/2;}
else{bz=(Math.random()-.5)*(RD-2);bx=RW/2-.4;ry=Math.PI/2;}
add(J(new THREE.BoxGeometry(.7+Math.random()*1.5,.25+Math.random()*.5,.15,2,1,1),.02),mt(bCols[i%6]),bx,by,bz,0,ry,0);}

// ====== HEARTH ======
const hearth=new THREE.Group();
add(J(new THREE.BoxGeometry(6,6,1.5,3,3,1),.08),mt(C.stoneD),0,3,0,0,0,0,0,0,0,hearth);
add(new THREE.BoxGeometry(4,3.5,1.6),mt(0x0a0a0a),0,1.75,0,0,0,0,0,0,0,hearth);
add(J(new THREE.BoxGeometry(3.8,3.3,.3,3,3,1),.04),mt(0x1a1a1a),0,1.8,-.6,0,0,0,0,0,0,hearth);
add(J(new THREE.BoxGeometry(7,.5,1.8,3,1,1),.05),mt(C.stoneL),0,6.2,0,0,0,0,0,0,0,hearth);
for(let s=-1;s<=1;s+=2)add(J(new THREE.BoxGeometry(.8,6,.8,1,3,1),.05),mt(C.stoneM),s*2.6,3,.2,0,0,0,0,0,0,hearth);
add(J(new THREE.BoxGeometry(4,3.5,1.2,2,2,1),.06),mt(C.stoneD),0,7.8,0,0,0,0,0,0,0,hearth);
add(J(new THREE.BoxGeometry(5,.3,2,3,1,2),.04),mt(C.stoneM),0,.15,.5,0,0,0,0,0,0,hearth);
for(let i=0;i<4;i++){const l=add(J(new THREE.ConeGeometry(.12,1.5+Math.random()*.5,5),.03),mt(C.woodD),
(Math.random()-.5)*1,.5+i*.15,(Math.random()-.5)*.3,0,0,Math.PI/2+(Math.random()-.5)*.4,0,0,0,hearth);}
for(let i=0;i<6;i++)add(new THREE.SphereGeometry(.06+Math.random()*.06,3,3),new THREE.MeshBasicMaterial({color:[0xff4400,0xff6600,0xaa2200][i%3]}),(Math.random()-.5)*1.2,.35,(Math.random()-.5)*.4,0,0,0,0,0,0,hearth);
for(let i=0;i<5;i++){const f=add(new THREE.ConeGeometry(.1+Math.random()*.12,.6+Math.random()*.5,4),new THREE.MeshBasicMaterial({color:[0xff6622,0xff9933,0xffcc44][i%3]}),(Math.random()-.5)*.8,.8+Math.random()*.3,(Math.random()-.5)*.3,0,0,0,0,0,0,hearth);fl.push({flame:f,idx:i*3});}
hearth.position.set(0,0,-RD/2+.8);scene.add(hearth);
// Big visible fire
const fireG=new THREE.Group();
for(let i=0;i<8;i++){
  const h=.8+Math.random()*.8;
  const r=.12+Math.random()*.15;
  const f=new THREE.Mesh(new THREE.ConeGeometry(r,h,4),new THREE.MeshBasicMaterial({color:[0xff4400,0xff6622,0xff9933,0xffcc44,0xff5511][i%5],transparent:true,opacity:.85}));
  f.position.set((Math.random()-.5)*1.2,.3+h/2+Math.random()*.2,(Math.random()-.5)*.5);
  fireG.add(f);
  fl.push({flame:f,idx:i*2+60});
}
// Extra glow embers at base
for(let i=0;i<10;i++){
  const e=new THREE.Mesh(new THREE.SphereGeometry(.04+Math.random()*.08,3,3),new THREE.MeshBasicMaterial({color:[0xff2200,0xff4400,0xff6600,0xaa2200][i%4]}));
  e.position.set((Math.random()-.5)*1.5,.25+Math.random()*.15,(Math.random()-.5)*.6);
  fireG.add(e);
}
fireG.position.set(0,0,-RD/2+1.2);
scene.add(fireG);
// Extra strong fire light
const fireL2=new THREE.PointLight(0xff4400,3,12);fireL2.position.set(0,1.5,-RD/2+1.5);fireL2.castShadow=true;scene.add(fireL2);
fl.push({light:fireL2,baseIntensity:3,idx:70});
const fireL3=new THREE.PointLight(0xffaa22,2,10);fireL3.position.set(0,2.5,-RD/2+2);scene.add(fireL3);
fl.push({light:fireL3,baseIntensity:2,idx:72});
const hL=new THREE.PointLight(0xff6622,4,16);hL.position.set(0,3,-RD/2+2);hL.castShadow=true;hL.shadow.mapSize.set(512,512);scene.add(hL);fl.push({light:hL,baseIntensity:4,idx:5});

// Mantel candles+jars
for(let i=0;i<3;i++){add(new THREE.CylinderGeometry(.04,.04,.2+Math.random()*.2,5),mt(0xcacab0),-1.5+i*.2,6.5,-RD/2+1);
const f=add(new THREE.SphereGeometry(.03,3,3),new THREE.MeshBasicMaterial({color:C.candle}),-1.5+i*.2,6.7+Math.random()*.1,-RD/2+1,0,0,0,1,1.5,1);fl.push({flame:f,idx:i+30});}
for(let i=0;i<2;i++){add(J(new THREE.CylinderGeometry(.15,.18,.35,6),.02),mt(C.clay),1.2+i*.5,6.42,-RD/2+1);
add(new THREE.TorusGeometry(.15,.02,4,6),mt(C.stoneM),1.2+i*.5,6.6,-RD/2+1,Math.PI/2,0,0,0,0,0);}

// ====== SPIT ROAST ======
const spit=new THREE.Group();
for(let s=-1;s<=1;s+=2){add(J(new THREE.BoxGeometry(.12,2.2,.12,1,3,1),.02),mm(C.iron),s*1.2,1.1,0,0,0,0,0,0,0,spit);add(new THREE.BoxGeometry(.06,.3,.06),mm(C.iron),s*1.2,2.3,0,0,0,0,0,0,0,spit);}
add(new THREE.CylinderGeometry(.04,.04,2.6,5),mm(C.iron),0,2.1,0,0,0,Math.PI/2,0,0,0,spit);
add(J(new THREE.SphereGeometry(.4,5,4),.06),mt(C.meat),0,2.1,0,0,0,0,1.8,.8,.8,spit);
spit.position.set(0,0,-RD/2+1.8);scene.add(spit);

// ====== TRIPOD+CAULDRON ======
const trip=new THREE.Group();
for(let i=0;i<3;i++){const a=(i/3)*Math.PI*2;const l=add(J(new THREE.CylinderGeometry(.04,.06,2.5,5),.02),mm(C.iron),Math.cos(a)*.5,1.15,Math.sin(a)*.5,Math.sin(a)*.15,0,-Math.cos(a)*.15,0,0,0,trip);}
add(new THREE.TorusGeometry(.35,.03,4,6),mm(C.iron),0,2.2,0,Math.PI/2,0,0,0,0,0,trip);
for(let c=0;c<4;c++)add(new THREE.TorusGeometry(.05,.015,4,4),mm(C.iron),0,1.8-c*.2,0,c%2===0?0:Math.PI/2,0,0,0,0,0,trip);
add(J(new THREE.SphereGeometry(.5,6,5,0,Math.PI*2,0,Math.PI*.7),.04),mm(C.iron),0,1,0,0,0,0,0,0,0,trip);
add(new THREE.TorusGeometry(.48,.04,4,7),mm(C.ironL),0,1.25,0,Math.PI/2,0,0,0,0,0,trip);
add(new THREE.TorusGeometry(.35,.025,4,6,Math.PI),mm(C.iron),0,1.6,0,0,0,0,0,0,0,trip);
add(new THREE.CircleGeometry(.44,6),mt(0x4a4a2a),0,1.2,0,-Math.PI/2,0,0,0,0,0,trip);
trip.position.set(-4.5,0,-3);scene.add(trip);
for(let i=0;i<3;i++){const f=add(new THREE.ConeGeometry(.06+Math.random()*.06,.3+Math.random()*.2,4),new THREE.MeshBasicMaterial({color:[0xff6622,0xff9933][i%2]}),-4.5+(Math.random()-.5)*.4,.15,-3+(Math.random()-.5)*.3);fl.push({flame:f,idx:i*5+10});}
const tpL=new THREE.PointLight(0xff6622,1.5,7);tpL.position.set(-4.5,1.5,-3);scene.add(tpL);fl.push({light:tpL,baseIntensity:1.5,idx:12});

// ====== STONE OVEN ======
const oven=new THREE.Group();
add(J(new THREE.BoxGeometry(3,2.5,2.5,2,2,2),.08),mt(C.stoneM),0,1.25,0,0,0,0,0,0,0,oven);
add(J(new THREE.SphereGeometry(1.5,5,4,0,Math.PI*2,0,Math.PI/2),.06),mt(C.stoneD),0,2.5,0,0,0,0,0,0,0,oven);
add(new THREE.BoxGeometry(1.2,1,.3),mt(0x0a0a0a),0,.8,1.2,0,0,0,0,0,0,oven);
const oG=add(new THREE.SphereGeometry(.3,3,3),new THREE.MeshBasicMaterial({color:0xff4400}),0,.6,.8,0,0,0,1.5,1,1,oven);fl.push({flame:oG,idx:15});
add(J(new THREE.CylinderGeometry(.25,.3,2,5),.03),mt(C.stoneD),0,3.8,0,0,0,0,0,0,0,oven);
oven.position.set(RW/2-2,0,-3);scene.add(oven);
const oL=new THREE.PointLight(0xff4400,1,5);oL.position.set(RW/2-2,1,-1.8);scene.add(oL);fl.push({light:oL,baseIntensity:1,idx:16});

// ====== POT RACK ======
const rack=new THREE.Group();
add(new THREE.CylinderGeometry(.05,.05,6,5),mm(C.iron),0,0,0,0,0,Math.PI/2,0,0,0,rack);
add(new THREE.CylinderGeometry(.04,.04,2.5,5),mm(C.iron),0,0,0,Math.PI/2,0,0,0,0,0,rack);
for(let s=-1;s<=1;s+=2)for(let c=0;c<5;c++)add(new THREE.TorusGeometry(.05,.015,4,4),mm(C.iron),s*2.2,.3+c*.25,0,c%2===0?0:Math.PI/2,0,0,0,0,0,rack);
function hangPot(x,y,sz){const pg=new THREE.Group();add(J(new THREE.CylinderGeometry(sz*.8,sz,sz*1.2,6),.03),mm(C.iron),0,0,0,0,0,0,0,0,0,pg);add(new THREE.TorusGeometry(sz*.8,.025,4,6),mm(C.ironL),0,sz*.6,0,Math.PI/2,0,0,0,0,0,pg);add(new THREE.TorusGeometry(sz*.6,.02,4,5,Math.PI),mm(C.iron),0,sz,0,0,0,0,0,0,0,pg);pg.position.set(x,y,0);rack.add(pg);}
hangPot(-2,-.8,.3);hangPot(-.8,-.7,.25);hangPot(.5,-.9,.35);hangPot(1.8,-.75,.28);
function hangPan(x,y){const pg=new THREE.Group();add(J(new THREE.CylinderGeometry(.25,.25,.08,6),.02),mc(C.copper),0,0,0,0,0,0,0,0,0,pg);add(new THREE.CylinderGeometry(.03,.03,.35,4),mc(C.copperL),.35,0,0,0,0,Math.PI/2,0,0,0,pg);pg.position.set(x,y,.3);rack.add(pg);}
hangPan(-1.5,-.5);hangPan(1,-.4);hangPan(2.5,-.6);
// Ladles
for(let i=0;i<2;i++){const ld=new THREE.Group();add(new THREE.CylinderGeometry(.015,.015,.7,4),mt(C.wood),0,0,0,0,0,.15,0,0,0,ld);add(new THREE.SphereGeometry(.07,4,3,0,Math.PI*2,0,Math.PI*.6),mm(C.iron),0,-.38,0,0,0,0,0,0,0,ld);ld.position.set(-2.5+i*5.5,-.2,.15);rack.add(ld);}
rack.position.set(0,RH-1.5,1);scene.add(rack);

// ====== MAIN TABLE ======
const table=new THREE.Group();
add(J(new THREE.BoxGeometry(5,.2,2.2,4,1,2),.03),mt(C.wood),0,1.5,0,0,0,0,0,0,0,table);
for(let x=-1;x<=1;x+=2)for(let z=-1;z<=1;z+=2)add(J(new THREE.BoxGeometry(.18,1.5,.18,1,2,1),.02),mt(C.woodD),x*2.1,.75,z*.85,0,0,0,0,0,0,table);
for(let z=-1;z<=1;z+=2)add(new THREE.BoxGeometry(4.2,.12,.12),mt(C.woodD),0,.5,z*.85,0,0,0,0,0,0,table);
table.position.set(0,0,2);scene.add(table);
const tY=1.62,tZ=2;

// Table items
add(J(new THREE.BoxGeometry(.8,.06,.5,2,1,1),.01),mt(C.woodL),-1.5,tY,tZ-.2);
{const kn=new THREE.Group();add(new THREE.BoxGeometry(.4,.02,.06),mm(0x8a8a8a),.15,0,0,0,0,0,0,0,0,kn);add(new THREE.BoxGeometry(.2,.04,.06),mt(C.woodD),-.15,0,0,0,0,0,0,0,0,kn);kn.position.set(-1.3,tY+.04,tZ-.2);kn.rotation.y=.3;scene.add(kn);}
// Bread
function mkBread(x,y,z,s){s=s||1;add(J(new THREE.SphereGeometry(.25*s,5,4),.04*s),mt(C.bread),x,y,z,0,0,0,1.3,.7,1);}
mkBread(-.5,tY+.12,tZ+.3,1);mkBread(-.2,tY+.12,tZ+.5,.8);mkBread(-.7,tY+.12,tZ+.6,.7);
// Cheese
add(J(new THREE.CylinderGeometry(.3,.3,.15,7),.02),mt(C.cheese),.5,tY+.08,tZ-.4);
add(J(new THREE.CylinderGeometry(.15,.15,.14,3),.02),mt(C.cheese),.85,tY+.07,tZ-.3);
// Carrots
for(let i=0;i<4;i++){add(J(new THREE.ConeGeometry(.04,.35,5),.01),mt(C.carrot),1.2+i*.12,tY+.06,tZ+.1,0,0,Math.PI/2+(Math.random()-.5)*.3);}
// Cabbage
add(J(new THREE.SphereGeometry(.2,5,4),.04),mt(C.cabbage),1.8,tY+.12,tZ+.4,0,0,0,1,.7,1);
// Mortar+pestle
add(J(new THREE.CylinderGeometry(.15,.18,.2,6),.02),mt(C.stoneM),-1.8,tY+.1,tZ+.4);
add(new THREE.CylinderGeometry(.03,.04,.3,5),mt(C.stoneL),-1.8,tY+.25,tZ+.4,0,0,.4);
// Rolling pin
add(new THREE.CylinderGeometry(.05,.05,.7,6),mt(C.woodL),.8,tY+.06,tZ-.6,0,0,Math.PI/2);
// Bowl
add(J(new THREE.SphereGeometry(.15,5,4,0,Math.PI*2,0,Math.PI*.5),.02),mt(C.woodL),-.5,tY+.01,tZ-.5,Math.PI,0,0);
// Plates
add(new THREE.CylinderGeometry(.22,.18,.04,7),mt(C.ceramic),.2,tY+.02,tZ-.5);
add(new THREE.CylinderGeometry(.22,.18,.04,7),mt(C.ceramic),1.5,tY+.02,tZ-.5);
// Mugs
function mkMug(x,y,z){const mg=new THREE.Group();add(J(new THREE.CylinderGeometry(.08,.1,.2,6),.01),mt(C.clay),0,0,0,0,0,0,0,0,0,mg);add(new THREE.TorusGeometry(.06,.015,4,5,Math.PI),mt(C.clay),.09,0,0,0,Math.PI/2,0,0,0,0,mg);mg.position.set(x,y+.1,z);scene.add(mg);}
mkMug(-2,tY,tZ-.5);mkMug(2.2,tY,tZ+.3);

// ====== PREP COUNTER (left wall) ======
const counter=new THREE.Group();
add(J(new THREE.BoxGeometry(1.5,1.6,5,1,2,3),.05),mt(C.wood),0,.8,0,0,0,0,0,0,0,counter);
add(J(new THREE.BoxGeometry(1.7,.15,5.2,2,1,3),.03),mt(C.stoneM),0,1.65,0,0,0,0,0,0,0,counter);

  { id: 2, pos: [6, 3, 3] },
  { id: 3, pos: [-4.5, 3.3, -3] }
];

slots.forEach(slot => {
  // Magenta sphere marker
  const markerGeo = new THREE.SphereGeometry(0.35, 12, 10);
  const markerMat = new THREE.MeshBasicMaterial({ color: 0xff00ff, transparent: true, opacity: 0.6 });
  const marker = new THREE.Mesh(markerGeo, markerMat);
  marker.position.set(slot.pos[0], slot.pos[1], slot.pos[2]);
  scene.add(marker);

  // Sprite label
  const canvas = document.createElement('canvas');
  canvas.width = 64;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ff00ff';
  ctx.beginPath();
  ctx.arc(32, 32, 28, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 36px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(slot.id), 32, 32);
  const tex = new THREE.CanvasTexture(canvas);
  const spriteMat = new THREE.SpriteMaterial({ map: tex, depthTest: false });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.position.set(slot.pos[0], slot.pos[1] + 0.7, slot.pos[2]);
  sprite.scale.set(0.8, 0.8, 1);
  scene.add(sprite);
});

// ====== SLOT PANEL ======
const slotsPanel = document.getElementById('slots-panel');
slots.forEach(slot => {
  const div = document.createElement('div');
  div.textContent = 'Slot ' + slot.id + ': [' + slot.pos.join(', ') + ']';
  div.addEventListener('click', () => {
    controls.target.set(slot.pos[0], slot.pos[1], slot.pos[2]);
  });
  slotsPanel.appendChild(div);
});

// ====== ORBIT CONTROLS ======
camera.position.set(0, 12, 18);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.update();

// ====== HUD UPDATE ======
function updateHUD() {
  document.getElementById('px').textContent = camera.position.x.toFixed(2);
  document.getElementById('py').textContent = camera.position.y.toFixed(2);
  document.getElementById('pz').textContent = camera.position.z.toFixed(2);
  document.getElementById('tx').textContent = controls.target.x.toFixed(2);
  document.getElementById('ty').textContent = controls.target.y.toFixed(2);
  document.getElementById('tz').textContent = controls.target.z.toFixed(2);
}

// ====== COPY KEYFRAME ======
function copyKeyframe() {
  const p = camera.position;
  const t = controls.target;
  const text = '{ pos: [' + p.x.toFixed(2) + ', ' + p.y.toFixed(2) + ', ' + p.z.toFixed(2) + '], target: [' + t.x.toFixed(2) + ', ' + t.y.toFixed(2) + ', ' + t.z.toFixed(2) + '] }';
  navigator.clipboard.writeText(text).then(() => {
    const el = document.getElementById('copied');
    el.style.opacity = '1';
    setTimeout(() => { el.style.opacity = '0'; }, 1200);
  });
}
window.copyKeyframe = copyKeyframe;

// ====== ANIMATE ======
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();
fl.forEach(f=>{const n=f.idx||0;if(f.light){const b=f.baseIntensity||1;f.light.intensity=b+Math.sin(t*7+n)*b*.18+Math.sin(t*13+n*2)*b*.12;}if(f.flame){f.flame.scale.y=1.5+Math.sin(t*9+n)*.4;f.flame.scale.x=1+Math.sin(t*7+n*3)*.2;}});
controls.update();
updateHUD();
renderer.render(scene,camera);}
animate();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
