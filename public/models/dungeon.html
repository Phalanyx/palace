function A(geo,mat,x,y,z,rx,ry,rz,sx,sy,sz,par){
  const m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);
  if(rx)m.rotation.x=rx;if(ry)m.rotation.y=ry;if(rz)m.rotation.z=rz;
  if(sx||sy||sz)m.scale.set(sx||1,sy||1,sz||1);
  m.castShadow=true;m.receiveShadow=true;(par||scene).add(m);return m}

A(J(new THREE.BoxGeometry(.7,RH,RD,1,3,4),.07),mt(C.sD),RW/2,RH/2,0);

  A(new THREE.SphereGeometry(.03,3,2),mm(C.ir),0,-.28,0,0,0,0,0,0,0,sw);

function mkBrazier(x,z){

  const f1=A(new THREE.SphereGeometry(.16,4,4),glow(0xffaa33,.9),0,1,0,0,0,0,1.2,2,1.2,b);

    new THREE.MeshBasicMaterial({color:0x888888,transparent:true,opacity:.15,side:THREE.DoubleSide}));

// ====== ORBIT ======
let isDrag=false,pX=0,pY=0,theta=.2,phi=.6,radius=14;
const tgt=new THREE.Vector3(0,2.8,0);
function upCam(){
  camera.position.x=tgt.x+radius*Math.sin(phi)*Math.sin(theta);
  camera.position.y=tgt.y+radius*Math.cos(phi);
  camera.position.z=tgt.z+radius*Math.sin(phi)*Math.cos(theta);
  camera.lookAt(tgt)}
upCam();
R.domElement.addEventListener('pointerdown',e=>{isDrag=true;pX=e.clientX;pY=e.clientY});
window.addEventListener('pointerup',()=>isDrag=false);
window.addEventListener('pointermove',e=>{if(!isDrag)return;
  theta+=(e.clientX-pX)*.005;phi=Math.max(.15,Math.min(1.4,phi-(e.clientY-pY)*.005));
  pX=e.clientX;pY=e.clientY;upCam()});
R.domElement.addEventListener('wheel',e=>{radius=Math.max(5,Math.min(25,radius+e.deltaY*.02));upCam()},{passive:true});
R.domElement.addEventListener('touchstart',e=>{isDrag=true;pX=e.touches[0].clientX;pY=e.touches[0].clientY},{passive:true});
window.addEventListener('touchmove',e=>{if(!isDrag)return;
  theta+=(e.touches[0].clientX-pX)*.005;phi=Math.max(.15,Math.min(1.4,phi-(e.touches[0].clientY-pY)*.005));
  pX=e.touches[0].clientX;pY=e.touches[0].clientY;upCam()},{passive:true});
window.addEventListener('touchend',()=>isDrag=false);

// ====== ANIMATE ======
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);const t=clock.getElapsedTime();
  fl.forEach(f=>{const n=f.idx||0;
    if(f.light){const b=f.baseIntensity||1;
      if(f.isRune)f.light.intensity=b*(.6+.4*Math.sin(t*1.5+n));
      else f.light.intensity=b+Math.sin(t*8+n)*b*.2+Math.sin(t*14+n*2)*b*.12}
    if(f.flame){f.flame.scale.y=1.5+Math.sin(t*9+n)*.4;f.flame.scale.x=1+Math.sin(t*7+n*3)*.2}
    if(f.f2){f.f2.scale.y=1.8+Math.sin(t*11+n)*.3;f.f2.scale.x=1+Math.sin(t*8+n*2)*.15}});
  scene.traverse(o=>{
    if(o.userData.t==='rune')o.material.opacity=.35+.45*(.5+.5*Math.sin(t*2));
    if(o.userData.t==='coal')o.material.opacity=.7+.3*Math.sin(t*3+o.position.x*10)});
  R.render(scene,camera)}
animate();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
</script>
